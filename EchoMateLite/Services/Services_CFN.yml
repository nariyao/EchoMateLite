AWSTemplateFormatVersion: 2010-09-09
Description: |
  This template create RESTFull API, and S3 bucket
Parameters:
  ProjectPrefix:
    Type: String
    Description: Input project name.
    Default: eml
  ProjectName:
    Type: String
    Description: Input project name.
    Default: EchoMateLite
  Environment:
    Type: String
    Description: Input stage name.
    Default: Dev
    AllowedValues:
      - Dev
      - Prod
Resources:
  # 1. Add encryption for S3 bucket
  EmlS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectPrefix}-bucket"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
          - Id: DeleteOldObjects
            Status: Enabled
            ExpirationInDays: 365
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ProjectPrefix
          Value: !Ref ProjectPrefix
        - Key: Name
          Value: !Sub "${ProjectPrefix}-${Environment}-bucket"

  # Rest API
  EmlRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectPrefix}-RestApi"
      Description: !Sub "This is the REST API for ${ProjectName}"
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ProjectPrefix
          Value: !Ref ProjectPrefix
        - Key: Name
          Value: !Sub "${ProjectPrefix}-RestApi"

Outputs:
  # S3 Bucket Outputs
  EmlS3BucketArn:
    Description: S3 bucket name.
    Value: !GetAtt EmlS3Bucket.Arn
    Export:
      Name: !Sub "${ProjectPrefix}-S3BucketArn"
  EmlS3BucketName:
    Description: S3 bucket name.
    Value: !Sub "${ProjectPrefix-bucket"
    Export:
      Name: !Sub "${ProjectPrefix}-S3BucketName"

  # Rest API Outputs
  EmlRestApiId:
    Description: RESTFull API ID.
    Value: !Ref EmlRestApi
    Export:
      Name: !Sub "${ProjectPrefix}-RestApiId"
  EmlRestApiName:
    Description: RESTFull API name.
    Value: !Sub "${ProjectPrefix}-${Environment}-RestApi"
    Export:
      Name: !Sub "${ProjectPrefix}-RestApiName"
  EmlRestApiEndpoint:
    Description: RESTFull API endpoint.
    Value: !Sub "https://${EmlRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
    Export:
      Name: !Sub "${ProjectPrefix}-RestApiEndpoint"
