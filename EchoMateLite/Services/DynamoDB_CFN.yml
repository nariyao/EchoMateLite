AWSTemplateFormatVersion: 2010-09-09
Description: |
  This template creates RESTful API, S3 bucket, and DynamoDB tables.
Parameters:
  ProjectPrefix:
    Type: String
    Description: The project prefix for the resources.
    Default: eml
    MinLength: 1
    MaxLength: 10
    AllowedPattern: "[a-zA-Z0-9-]*"

  ProjectName:
    Type: String
    Description: The name of the project.
    Default: EmailMateLite
    MinLength: 1
    AllowedPattern: "[a-zA-Z0-9-]*"

Resources:
  DynamoDBTableForUserDetails:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${ProjectPrefix}-UserDetails"
      AttributeDefinitions:
        - AttributeName: UserId
          AttributeType: S
      KeySchema:
        - AttributeName: UserId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EmlDynamoDBTableForPosts:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${ProjectPrefix}-Posts"
      AttributeDefinitions:
        - AttributeName: PostId
          AttributeType: S
      KeySchema:
        - AttributeName: PostId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  EmlDynamoDBTableForImageDetails:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "${ProjectPrefix}-ImageDetails"
      AttributeDefinitions:
        - AttributeName: ImageId
          AttributeType: S
      KeySchema:
        - AttributeName: ImageId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  EmlDynamoDBTableForUserDetails:
    Description: DynamoDB table name for user details.
    Value: !Ref DynamoDBTableForUserDetails
    Export:
      Name: !Sub "${ProjectPrefix}-DynamoDBTableForUserDetails"
  EmlDynamoDBTableForUserDetailsArn:
    Description: DynamoDB table ARN for user details.
    Value: !GetAtt DynamoDBTableForUserDetails.Arn
    Export:
      Name: !Sub "${ProjectPrefix}-DynamoDBTableArnForUserDetails"

  EmlDynamoDBTableForPosts:
    Description: DynamoDB table name for posts.
    Value: !Ref EmlDynamoDBTableForPosts
    Export:
      Name: !Sub "${ProjectPrefix}-DynamoDBTableForPosts"
  EmlDynamoDBTableForPostsArn:
    Description: DynamoDB table ARN for posts.
    Value: !GetAtt EmlDynamoDBTableForPosts.Arn
    Export:
      Name: !Sub "${ProjectPrefix}-DynamoDBTableArnForPosts"

  EmlDynamoDBTableForImageDetails:
    Description: DynamoDB table name for image details.
    Value: !Ref EmlDynamoDBTableForImageDetails
    Export:
      Name: !Sub "${ProjectPrefix}-DynamoDBTableForImageDetails"
  EmlDynamoDBTableForImageDetailsArn:
    Description: DynamoDB table ARN for image details.
    Value: !GetAtt EmlDynamoDBTableForImageDetails.Arn
    Export:
      Name: !Sub "${ProjectPrefix}-DynamoDBTableArnForImageDetails"
