AWSTemplateFormatVersion: "2010-09-09"
Description: DevOps infrastructure setup for EchoMateLite project

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: EC2 Configuration
        Parameters:
          - InstanceType
          - KeyName
          - ImageId
          - Environment
          - ProjectPrefix
          - EBSVolumeId
    ParameterLabels:
      InstanceType:
        default: Jenkins Instance Type
      KeyName:
        default: SSH Key Pair
      ImageId:
        default: Amazon Machine Image ID
      Environment:
        default: Environment
      ProjectPrefix:
        default: Project Prefix
      EBSVolumeId:
        default: EBS Volume ID

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name for resource tagging
  ProjectPrefix:
    Type: String
    Default: eml
    Description: Project prefix for resource naming
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
      - t2.medium
    Description: The instance type for Jenkins master instance.
  SSHKeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: EML-JenkinsMaster-key
    Description: The EC2 key pair for Jenkins master instance.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
    Description: The AMI ID for Jenkins master instance.
  EBSVolumeId:
    Type: String
    Default: ""
    Description: Volume ID for Jenkins master instance
  GitUri:
    Type: String
    Default: https://github.com/nariyao/EchoMateLite.git
    Description: Git repository URI for Jenkins to poll

Conditions:
  CreateNewVolumeCondition: !Equals [!Ref EBSVolumeId, ""]

Resources:
  # Jenkins master EC2 instance
  emlJenkinsEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref SSHKeyName
      IamInstanceProfile: !ImportValue EMLJenkinsMasterInstanceProfile
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash -xe
            # Update system and install dependencies
            sudo yum update -y
            # Clone devops branch from EchoMateLite git repository
            git clone --branch devops --single-branch https://github.com/nariyao/EchoMateLite.git 
            cd EchoMateLite
            git checkout devops
            cd EchoMateLite/CloudFormation/DevOps
            sudo chmod +x emlJenkinsEC2-Entrypoint.sh
            sudo ./emlJenkinsEC2-Entrypoint.sh
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true

      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          DeleteOnTermination: true
          SubnetId: !ImportValue DevOps-PublicSubnet1Id
          GroupSet:
            - !ImportValue DevOps-SecurityGroupId

      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-jenkins-ec2-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: EML
        - Key: Backup
          Value: true

  # Jenkins master backup EBS volume
  emlJenkinsEbsVolume:
    Type: AWS::EC2::Volume
    Condition: CreateNewVolumeCondition
    Properties:
      AvailabilityZone: !GetAtt emlJenkinsEC2.AvailabilityZone
      Size: 10
      VolumeType: gp3
      Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectPrefix}-jenkins-ebs-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: EML
        - Key: Backup
          Value: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # Attach backup EBS volume to Jenkins master instance
  emlJenkinsEbsVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/xvdf
      InstanceId: !Ref emlJenkinsEC2
      VolumeId:
        Fn::If:
          - CreateNewVolumeCondition
          - !Ref emlJenkinsEbsVolume
          - !Ref EBSVolumeId

  # # Jenkins master Elastic IP
  # emlJenkinsEIP:
  #   Type: AWS::EC2::EIP
  #   Properties:
  #     Domain: vpc
  #     Tags:
  #       - Key: Name
  #         Value: !Sub ${ProjectPrefix}-jenkins-eip-${Environment}
  #       - Key: Environment
  #         Value: !Ref Environment

  # emlJenkinsEIPAssociation:
  #   Type: AWS::EC2::EIPAssociation
  #   Properties:
  #     EIP: !Ref emlJenkinsEIP
  #     InstanceId: !Ref emlJenkinsEC2

  # Artifact Bucket
  emlDevopsArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: eml-artifacts-bucket
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AutoDeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  # EML ECR Repository
  EchoMateLiteRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectPrefix}-echomate-lite-${Environment}
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 30 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

Outputs:
  JenkinsURL:
    Description: Jenkins URL
    Value: !GetAtt emlJenkinsEC2.PublicIp
  JenkinsInitialPassword:
    Description: Command to get Jenkins initial admin password
    Value: !Sub "sudo cat /var/lib/jenkins/secrets/initialAdminPassword on ${emlJenkinsEC2}"
  ArtifactsBucketName:
    Description: S3 bucket for build artifacts
    Value: !Ref emlDevopsArtifactsBucket
    Export:
      Name: emlArtifactsBucket
  EcrRepositoryURI:
    Description: ECR Repository URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EchoMateLiteRepository}"
    Export:
      Name: emlRepositoryURI
