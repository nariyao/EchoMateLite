AWSTemplateFormatVersion: "2010-09-09"
Description: Creates IAM roles and policies for EchoMateLite (EML) resources with least privilege access

Resources:
  # Jenkins master role with least privilege access
  EMLJenkinsMasterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EMLJenkinsMasterRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
              AWS:
                - !Sub "arn:aws:iam::710271918664:role/EML_DevOps_CF_Role"
            Action:
              - sts:AssumeRole
      Path: "/"
  # Jenkins master instance profile
  EMLJenkinsMasterInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: EMLJenkinsMasterRole
      Path: "/"
      Roles:
        - !Ref EMLJenkinsMasterRole

  # AWS user-derived policies for EchoMateLite (EML) resources
  EMLCloudFormationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMLCloudFormationPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResource
              - cloudformation:ListStacks
              - cloudformation:GetTemplateSummary
              - cloudformation:GetTemplate
              - cloudformation:SetStackPolicy
            Resource:
              - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/eml*/*"
              - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/EML*/*"
              - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/Eml*/*"
          - Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
            Resource: "*"
      Roles:
        - !Ref EMLJenkinsMasterRole

  EMLS3ArtifactPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMLS3ArtifactPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource: !Sub "arn:aws:s3:::eml-artifacts-bucket/*"
      Roles:
        - !Ref EMLJenkinsMasterRole
  EMLRepository:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMLRepository
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:GetRepositoryPolicy
              - ecr:DescribeRepositories
              - ecr:ListImages
              - ecr:DescribeImages
              - ecr:BatchGetImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
            Resource:
              - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/eml-*"
              - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/EML-*"
              - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/Eml-*"
      Roles:
        - !Ref EMLJenkinsMasterRole

  EMLDynamoDBPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMLDynamoDBPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:ListTables
              - dynamodb:UpdateTable
              - dynamodb:TagResource
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/eml-*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/EML-*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Eml-*"
      Roles:
        - !Ref EMLJenkinsMasterRole
  # EMLAPIGatewayPolicy:
  EMLAPIGatewayPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMLAPI-GatewayPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - apigateway:POST
              - apigateway:GET
              - apigateway:PUT
              - apigateway:DELETE
            Resource:
              - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis*"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/account*"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usage*"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/tags*"
      Roles:
        - !Ref EMLJenkinsMasterRole

  EMLElastiCachePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMLElastiCachePolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - elasticache:CreateCacheCluster
              - elasticache:DeleteCacheCluster
              - elasticache:DescribeCacheClusters
              - elasticache:ModifyCacheCluster
            Resource:
              - !Sub "arn:aws:elasticache:${AWS::Region}:${AWS::AccountId}:cluster/eml-*"
              - !Sub "arn:aws:elasticache:${AWS::Region}:${AWS::AccountId}:cluster/EML-*"
              - !Sub "arn:aws:elasticache:${AWS::Region}:${AWS::AccountId}:cluster/Eml-*"
          - Effect: Allow
            Action:
              - elasticache:CreateReplicationGroup
              - elasticache:DeleteReplicationGroup
              - elasticache:ModifyReplicationGroup
              - elasticache:DescribeReplicationGroups
              - elasticache:ListTagsForResource
              - elasticache:AddTagsToResource
              - elasticache:RemoveTagsFromResource
            Resource:
              - !Sub "arn:aws:elasticache:${AWS::Region}:${AWS::AccountId}:replicationgroup/eml-*"
              - !Sub "arn:aws:elasticache:${AWS::Region}:${AWS::AccountId}:replicationgroup/EML-*"
              - !Sub "arn:aws:elasticache:${AWS::Region}:${AWS::AccountId}:replicationgroup/Eml-*"
          - Effect: Allow
            Action:
              - elasticache:CreateCacheSubnetGroup
              - elasticache:DeleteCacheSubnetGroup
              - elasticache:DescribeCacheSubnetGroups
              - elasticache:ModifyCacheSubnetGroup
            Resource:
              - !Sub "arn:aws:elasticache:${AWS::Region}:${AWS::AccountId}:subnetgroup/eml-*"
              - !Sub "arn:aws:elasticache:${AWS::Region}:${AWS::AccountId}:subnetgroup/EML-*"
              - !Sub "arn:aws:elasticache:${AWS::Region}:${AWS::AccountId}:subnetgroup/Eml-*"
      Roles:
        - !Ref EMLJenkinsMasterRole

  # Security group policy
  EMLEC2Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMLEC2Policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeSecurityGroups
              - ec2:DescribeVpcs
              - ec2:DescribeSubnets
              - ec2:DescribeNetworkInterfaces
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
            Resource: "*"
      Roles:
        - !Ref EMLJenkinsMasterRole

  # S3 bucket policy
  EMLS3Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMLS3Policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:ListAllMyBuckets
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:GetBucketPolicy
              - s3:PutBucketAcl
              - s3:GetBucketAcl
              - s3:PutBucketTagging
              - s3:GetBucketTagging
              - s3:PutBucketVersioning
              - s3:GetBucketVersioning
              - s3:PutBucketLogging
              - s3:GetBucketLogging
              - s3:PutBucketNotificationConfiguration
              - s3:GetBucketNotificationConfiguration
            Resource:
              - !Sub "arn:aws:s3:::eml-*"
              - !Sub "arn:aws:s3:::EML-*"
              - !Sub "arn:aws:s3:::Eml-*"

      Roles:
        - !Ref EMLJenkinsMasterRole

  # Cognito policy
  EMLCognitoPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EMLCognitoPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cognito:CreateUserPool
              - cognito:DeleteUserPool
              - cognito:DescribeUserPool
              - cognito:ListUserPools
              - cognito:UpdateUserPool
              - cognito:TagResource
              - cognito:UntagResource
              - cognito:ListTagsForResource
              - cognito:CreateUserPoolClient
              - cognito:DeleteUserPoolClient
              - cognito:DescribeUserPoolClient
              - cognito:ListUserPoolClients
              - cognito:UpdateUserPoolClient
              - cognito:TagUserPoolClient
              - cognito:UntagUserPoolClient
              - cognito:ListTagsForUserPoolClient
              - cognito:CreateIdentityPool
              - cognito:DeleteIdentityPool
              - cognito:DescribeIdentityPool
              - cognito:ListIdentityPools
              - cognito:UpdateIdentityPool
              - cognito:TagIdentityPool
              - cognito:UntagIdentityPool
              - cognito:ListTagsForIdentityPool
              - cognito:CreateIdentityPoolRoleAttachment
              - cognito:DeleteIdentityPoolRoleAttachment
              - cognito:DescribeIdentityPoolRoleAttachment
              - cognito:ListIdentityPoolRoleAttachments
              - cognito:UpdateIdentityPoolRoleAttachment
          - Effect: Allow
            Action:
              - cognito-idp:CreateUserPool
              - cognito-idp:DeleteUserPool
              - cognito-idp:DescribeUserPool
              - cognito-idp:ListUserPools
              - cognito-idp:UpdateUserPool
              - cognito-idp:TagResource
              - cognito-idp:UntagResource
              - cognito-idp:ListTagsForResource
              - cognito-idp:CreateUserPoolClient
              - cognito-idp:DeleteUserPoolClient
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:ListUserPoolClients
              - cognito-idp:UpdateUserPoolClient
              - cognito-idp:TagUserPoolClient
              - cognito-idp:UntagUserPoolClient
              - cognito-idp:ListTagsForUserPoolClient
              - cognito-idp:CreateIdentityPool
              - cognito-idp:DeleteIdentityPool
              - cognito-idp:DescribeIdentityPool
              - cognito-idp:ListIdentityPools
              - cognito-idp:UpdateIdentityPool
              - cognito-idp:TagIdentityPool
              - cognito-idp:UntagIdentityPool
              - cognito-idp:ListTagsForIdentityPool
              - cognito-idp:CreateIdentityPoolRoleAttachment
              - cognito-idp:DeleteIdentityPoolRoleAttachment
              - cognito-idp:DescribeIdentityPoolRoleAttachment
              - cognito-idp:ListIdentityPoolRoleAttachments
              - cognito-idp:UpdateIdentityPoolRoleAttachment
            Resource:
              - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/eml-*"
              - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/EML-*"
              - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/Eml-*"
      Roles:
        - !Ref EMLJenkinsMasterRole
Outputs:
  EMLJenkinsMasterInstanceProfile:
    Description: Instance profile for the EML Jenkins master
    Value: !Ref EMLJenkinsMasterInstanceProfile
    Export:
      Name: EMLJenkinsMasterInstanceProfile
